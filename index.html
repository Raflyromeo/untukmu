<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hanya untukmu</title>
    <style>
      :root {
        --envelope-width: 300px;
        --envelope-height: 200px;
        --card-width: 270px;
        --card-height: 170px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #fae1dd;
        font-family: "Segoe UI", sans-serif;
        padding: 20px;
      }

      .container {
        text-align: center;
        position: relative;
        max-width: 100%;
        width: 100%;
      }

      .valentines {
        position: relative;
        cursor: pointer;
        animation: up 3s ease-in-out infinite;
        max-width: 100%;
        margin: 0 auto;
        width: var(--envelope-width);
        height: calc(var(--envelope-height) + 100px);
      }

      @keyframes up {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-30px);
        }
      }

      .envelope {
        width: var(--envelope-width);
        height: var(--envelope-height);
        background-color: #f08080;
        position: relative;
        border-radius: 2px;
        margin: 0 auto;
      }

      .envelope:before {
        background-color: #f08080;
        content: "";
        position: absolute;
        width: 212px;
        height: 212px;
        transform: rotate(45deg);
        top: -105px;
        left: 44px;
        border-radius: 30px 0 0 0;
      }

      .front {
        position: absolute;
        border-right: 180px solid #f4978e;
        border-top: 95px solid transparent;
        border-bottom: 100px solid transparent;
        left: 120px;
        top: 5px;
        width: 0;
        height: 0;
        z-index: 10;
      }

      .front:before {
        position: absolute;
        content: "";
        border-left: 300px solid #f8ad9d;
        border-top: 195px solid transparent;
        left: -120px;
        top: -95px;
        width: 0;
        height: 0;
      }

      .card {
        position: absolute;
        background-color: #fff8e6;
        width: var(--card-width);
        height: var(--card-height);
        top: 10px;
        left: 0;
        right: 0;
        margin: 0 auto;
        border: 1px solid #d62828;
        padding: 15px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        transform-origin: bottom center;
        transition: transform 1s ease, top 1s ease;
        z-index: 5;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        flex-direction: column;
      }

      .card.opened {
        top: -220px;
        transform: rotateX(20deg) rotateZ(-2deg);
      }

      .message {
        opacity: 0;
        transition: opacity 0.5s ease;
        font-size: 18px;
        color: #d62828;
        font-weight: bold;
        line-height: 1.4;
      }

      .message.visible {
        opacity: 1;
      }

      .sender {
        position: absolute;
        bottom: 10px;
        right: 15px;
        font-size: 14px;
        color: #a61c1c;
        font-style: italic;
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      .card.opened .sender {
        opacity: 1;
      }

      .hearts {
        position: absolute;
        top: 50px;
        left: 20px;
        z-index: 20;
      }

      .one,
      .two,
      .three,
      .four,
      .five {
        background-color: red;
        display: inline-block;
        height: 10px;
        margin: 0 10px;
        position: relative;
        transform: rotate(-45deg);
        width: 10px;
      }

      .one:before,
      .one:after,
      .two:before,
      .two:after,
      .three:before,
      .three:after,
      .four:before,
      .four:after,
      .five:before,
      .five:after {
        content: "";
        background-color: red;
        border-radius: 50%;
        height: 10px;
        position: absolute;
        width: 10px;
      }

      .one:before,
      .two:before,
      .three:before,
      .four:before,
      .five:before {
        top: -5px;
        left: 0;
      }

      .one:after,
      .two:after,
      .three:after,
      .four:after,
      .five:after {
        left: 5px;
        top: 0;
      }

      .one {
        left: 10px;
        animation: heart 1s ease-out infinite;
      }
      .two {
        left: 30px;
        animation: heart 2s ease-out infinite;
      }
      .three {
        left: 50px;
        animation: heart 1.5s ease-out infinite;
      }
      .four {
        left: 70px;
        animation: heart 2.3s ease-out infinite;
      }
      .five {
        left: 90px;
        animation: heart 1.7s ease-out infinite;
      }

      @keyframes heart {
        0% {
          transform: translateY(0) rotate(-45deg) scale(0.3);
          opacity: 1;
        }
        100% {
          transform: translateY(-150px) rotate(-45deg) scale(1.3);
          opacity: 0;
        }
      }

      .btn {
        margin-top: 30px;
        padding: 12px 20px;
        background-color: #d62828;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 16px;
        text-decoration: none;
        display: inline-block;
        transition: background-color 0.3s ease;
      }

      .btn:hover {
        background-color: #a61c1c;
      }

      /* Media queries untuk responsivitas */
      @media (max-width: 768px) {
        .valentines {
          width: 280px;
          height: calc(187px + 80px);
        }
        
        .envelope {
          width: 280px;
          height: 187px;
        }
        
        .envelope:before {
          width: 198px;
          height: 198px;
          top: -98px;
          left: 41px;
        }
        
        .front {
          border-right: 168px solid #f4978e;
          border-top: 89px solid transparent;
          border-bottom: 93px solid transparent;
          left: 112px;
        }
        
        .front:before {
          border-left: 280px solid #f8ad9d;
          border-top: 182px solid transparent;
          left: -112px;
          top: -89px;
        }
        
        .card {
          width: 252px;
          height: 159px;
          padding: 12px;
        }
        
        .card.opened {
          top: -200px;
        }
        
        .message {
          font-size: 16px;
        }
        
        .hearts {
          top: 47px;
          left: 18px;
        }
        
        .btn {
          margin-top: 25px;
          font-size: 15px;
          padding: 11px 18px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 15px;
        }
        
        .valentines {
          width: 250px;
          height: calc(167px + 70px);
        }
        
        .envelope {
          width: 250px;
          height: 167px;
        }
        
        .envelope:before {
          width: 177px;
          height: 177px;
          top: -88px;
          left: 37px;
        }
        
        .front {
          border-right: 150px solid #f4978e;
          border-top: 79px solid transparent;
          border-bottom: 83px solid transparent;
          left: 100px;
          top: 4px;
        }
        
        .front:before {
          border-left: 250px solid #f8ad9d;
          border-top: 163px solid transparent;
          left: -100px;
          top: -79px;
        }
        
        .card {
          width: 225px;
          height: 142px;
          padding: 10px;
        }
        
        .card.opened {
          top: -180px;
        }
        
        .message {
          font-size: 15px;
        }
        
        .sender {
          font-size: 13px;
          bottom: 8px;
          right: 12px;
        }
        
        .hearts {
          top: 42px;
          left: 16px;
        }
        
        .one, .two, .three, .four, .five {
          height: 8px;
          width: 8px;
          margin: 0 8px;
        }
        
        .one:before, .one:after, .two:before, .two:after, 
        .three:before, .three:after, .four:before, .four:after, 
        .five:before, .five:after {
          height: 8px;
          width: 8px;
        }
        
        .one:before, .two:before, .three:before, .four:before, .five:before {
          top: -4px;
        }
        
        .one:after, .two:after, .three:after, .four:after, .five:after {
          left: 4px;
        }
        
        .one { left: 8px; }
        .two { left: 24px; }
        .three { left: 40px; }
        .four { left: 56px; }
        .five { left: 72px; }
        
        .btn {
          margin-top: 20px;
          font-size: 14px;
          padding: 10px 16px;
        }
        
        @keyframes up {
          0%, 100% {
            transform: translateY(0);
          }
          50% {
            transform: translateY(-20px);
          }
        }
      }

      @media (max-width: 360px) {
        .valentines {
          width: 220px;
          height: calc(147px + 60px);
        }
        
        .envelope {
          width: 220px;
          height: 147px;
        }
        
        .envelope:before {
          width: 156px;
          height: 156px;
          top: -77px;
          left: 32px;
        }
        
        .front {
          border-right: 132px solid #f4978e;
          border-top: 70px solid transparent;
          border-bottom: 73px solid transparent;
          left: 88px;
          top: 3px;
        }
        
        .front:before {
          border-left: 220px solid #f8ad9d;
          border-top: 143px solid transparent;
          left: -88px;
          top: -70px;
        }
        
        .card {
          width: 198px;
          height: 125px;
          padding: 8px;
        }
        
        .card.opened {
          top: -160px;
        }
        
        .message {
          font-size: 14px;
        }
        
        .sender {
          font-size: 12px;
        }
        
        .hearts {
          top: 37px;
          left: 14px;
        }
        
        .btn {
          font-size: 13px;
          padding: 9px 14px;
        }
      }

      /* Untuk orientasi landscape pada perangkat mobile */
      @media (max-height: 500px) and (orientation: landscape) {
        body {
          padding: 10px;
          min-height: auto;
          height: auto;
        }
        
        .container {
          display: flex;
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: 30px;
          flex-wrap: wrap;
        }
        
        .valentines {
          animation: none;
          margin: 0;
        }
        
        .btn {
          margin-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="valentines" id="valentine">
        <div class="hearts">
          <div class="one"></div>
          <div class="two"></div>
          <div class="three"></div>
          <div class="four"></div>
          <div class="five"></div>
        </div>
        <div class="envelope"></div>
        <div class="front"></div>
        <div class="card" id="card">
          <div class="message" id="message">you're absolutely gorgeous.</div>
          <div class="sender">~ Rafly Romeo</div>
        </div>
      </div>
      <a href="flower.html" class="btn">click here bebe</a>
    </div>

    <script>
      const valentine = document.getElementById("valentine");
      const card = document.getElementById("card");
      const message = document.getElementById("message");

      let isOpen = false;

      valentine.addEventListener("click", () => {
        isOpen = !isOpen;

        if (isOpen) {
          card.classList.add("opened");
          message.classList.add("visible");
        } else {
          card.classList.remove("opened");
          message.classList.remove("visible");
        }
      });
    </script>
  </body>
</html>
